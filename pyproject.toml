# Makes `tangerine` and `app` importable from anywhere after `pip install -e .`
# (no PYTHONPATH needed). Dependencies stay in requirements.txt.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tangerine-resilience"
version = "1.0.0"
description = "Financial resilience engine and 90-day plan app (Sheridan Datathon 2026, Tangerine track)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tangerine*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
